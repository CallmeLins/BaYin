[package]
name = "bayin"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    ".",
    "crates/bayin-playback",
]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bayin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# OS keyring 凭据后端（Windows Credential Manager / macOS Keychain / Linux Secret Service）。
# 默认关闭：跨平台构建需系统 keyring 后端；开启后 CredentialStore 可用 keyring 实现。
# 注意：仅桌面端（非 android/ios）启用该依赖。
keyring = ["dep:keyring"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
walkdir = "2"
base64 = "0.22"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
roxmltree = "0.20"
url = "2"
md5 = "0.7"
rand = "0.8"
rayon = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# 音频引擎
symphonia = { version = "0.5", features = [
    "mp3", "flac", "wav", "pcm", "ogg", "vorbis", "aac", "isomp4", "aiff", "alac"
] }
cpal = "0.15"
rustfft = "6.2"
rubato = "0.15"
crossbeam-channel = "0.5"
ringbuf = "0.4"
log = "0.4"
# 音乐源连接器抽象层：同步 trait 桥接既有 async utils
pollster = "0.3"
bayin-playback = { path = "crates/bayin-playback" }
tauri-plugin-edge-to-edge = "0.3.3"
bayin-system-media = { path = "plugins/system-media" }
tauri-plugin-log = "2.8.0"
tauri-plugin-clipboard-manager = "2.3.2"

# 桌面端专用依赖（排除 Android 和 iOS）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
notify = { version = "6", features = ["macos_fsevent"] }
# OS keyring 后端（仅当启用 `keyring` feature 时引入；非 android/ios 桌面目标）
keyring = { version = "4", features = ["v1"], optional = true }

# Android 专用依赖
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Media",
    "Media_Playback",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

