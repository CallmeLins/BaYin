[package]
name = "bayin-system-media"
version = "0.1.0"
edition = "2021"
build = "build.rs"
links = "bayin-system-media"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Android JNI (only compiled on Android)
[target.'cfg(target_os = "android")'.dependencies]
bayin-playback = { path = "../../crates/bayin-playback" }

# macOS: cocoa + objc for Now Playing API
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
block = "0.1"

# Windows: windows crate for SMTC
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "Foundation",
    "Win32_System_WinRT",
] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
