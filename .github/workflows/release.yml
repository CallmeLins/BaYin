name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      tag_name: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get Tag Name
        id: get-tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = "${{ steps.get-tag.outputs.tag }}";
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `BaYin ${tagName}`,
              draft: true,
              prerelease: false
            });
            core.setOutput('id', data.id);

  build-desktop:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rust_targets: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
          - os: windows-2022
            rust_targets: aarch64-pc-windows-msvc
            build_target: aarch64-pc-windows-msvc
          - os: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_target: universal-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./src-ui

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Prepare Tauri signing key
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is empty or not configured" >&2
            exit 1
          fi

          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"

          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
          else
            if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
              && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
            elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
              ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
              printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
            else
              echo "Unsupported TAURI_SIGNING_PRIVATE_KEY format" >&2
              exit 1
            fi
          fi

          KEY_B64=""
          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          elif command -v openssl >/dev/null 2>&1; then
            KEY_B64=$(openssl base64 -A -in "$KEY_PATH")
          fi

          if [ -z "$KEY_B64" ]; then
            echo "Failed to convert signing key to base64" >&2
            exit 1
          fi

          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build & Upload Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.build_target }}
          tauriScript: npx tauri

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, armv7, x86_64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./src-ui

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Prepare Tauri signing key
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is empty or not configured" >&2
            exit 1
          fi

          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"

          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
          else
            if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
              && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
            elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
              ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
              printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
            else
              echo "Unsupported TAURI_SIGNING_PRIVATE_KEY format" >&2
              exit 1
            fi
          fi

          KEY_B64=""
          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          elif command -v openssl >/dev/null 2>&1; then
            KEY_B64=$(openssl base64 -A -in "$KEY_PATH")
          fi

          if [ -z "$KEY_B64" ]; then
            echo "Failed to convert signing key to base64" >&2
            exit 1
          fi

          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Initialize Android Project
        run: npx tauri android init

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Generate keystore.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p src-tauri/gen/android
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Configure Gradle Signing
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"

          if ! grep -q "import java.io.FileInputStream" "$GRADLE_FILE"; then
            sed -i '1i import java.io.FileInputStream' "$GRADLE_FILE"
          fi
          if ! grep -q "import java.util.Properties" "$GRADLE_FILE"; then
            sed -i '1i import java.util.Properties' "$GRADLE_FILE"
          fi

          if ! grep -q "keystorePropsFile" "$GRADLE_FILE"; then
            cat >> "$GRADLE_FILE" << 'EOF'

          val keystorePropsFile = rootProject.file("keystore.properties")
          if (keystorePropsFile.exists()) {
              val keystoreProps = Properties().apply {
                  load(FileInputStream(keystorePropsFile))
              }
              android.signingConfigs.getByName("release") {
                  storeFile = file(keystoreProps["storeFile"] as String)
                  storePassword = keystoreProps["storePassword"] as String
                  keyAlias = keystoreProps["keyAlias"] as String
                  keyPassword = keystoreProps["keyPassword"] as String
              }
          }
          EOF
          fi

      - name: Build Android APK
        run: npx tauri android build --target ${{ matrix.target }}

      - name: Upload APK to Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
          TARGET_ARCH: ${{ matrix.target }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tagName = process.env.TAG_NAME;
            const arch = process.env.TARGET_ARCH;
            const releaseId = parseInt(process.env.RELEASE_ID, 10);

            const apkPaths = [
              `src-tauri/gen/android/app/build/outputs/apk/${arch}/release`,
              'src-tauri/gen/android/app/build/outputs/apk/universal/release',
              'src-tauri/gen/android/app/build/outputs/apk/release'
            ];

            let uploaded = false;
            for (const dir of apkPaths) {
              if (!fs.existsSync(dir)) continue;
              const apks = fs.readdirSync(dir).filter((f) => f.endsWith('.apk') && !f.includes('unsigned'));
              for (const apk of apks) {
                const apkPath = path.join(dir, apk);
                const newName = `BaYin-${tagName}-android-${arch}.apk`;
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId,
                  name: newName,
                  data: fs.readFileSync(apkPath)
                });
                const sigPath = `${apkPath}.sig`;
                if (fs.existsSync(sigPath)) {
                  await github.rest.repos.uploadReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: releaseId,
                    name: `${newName}.sig`,
                    data: fs.readFileSync(sigPath)
                  });
                }
                uploaded = true;
              }
            }

            if (!uploaded) {
              throw new Error(`No signed APK found for arch: ${arch}`);
            }

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore" src-tauri/gen/android/keystore.properties

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-22.04
    needs: [build-desktop, build-android]
    steps:
      - name: Prepare GH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh --version || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl || true

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"

          mac_url=""; mac_sig=""
          win_x64_url=""; win_x64_sig=""
          win_arm64_url=""; win_arm64_sig=""
          android_aarch64_url=""; android_aarch64_sig=""
          android_armv7_url=""; android_armv7_sig=""
          android_x64_url=""; android_x64_sig=""

          shopt -s nullglob
          for sig in dl/*.sig; do
            artifact="${sig%.sig}"
            fname=$(basename "$artifact")
            lower=$(echo "$fname" | tr '[:upper:]' '[:lower:]')
            url="$BASE_URL/$fname"
            sig_content=$(tr -d '\r\n' < "$sig")

            if [[ "$lower" == *darwin* ]] || [[ "$lower" == *.app.tar.gz ]] || [[ "$lower" == *.tar.gz ]]; then
              mac_url="$url"
              mac_sig="$sig_content"
              continue
            fi

            is_windows_artifact=0
            if [[ "$lower" == *windows* ]] || [[ "$lower" == *win* ]] || [[ "$lower" == *.msi* ]] || [[ "$lower" == *.exe* ]] || [[ "$lower" == *.zip* ]]; then
              is_windows_artifact=1
            fi

            if [[ "$is_windows_artifact" -eq 1 ]]; then
              if [[ "$lower" == *aarch64* ]] || [[ "$lower" == *arm64* ]]; then
                win_arm64_url="$url"
                win_arm64_sig="$sig_content"
              elif [[ "$lower" == *x86_64* ]] || [[ "$lower" == *x64* ]]; then
                win_x64_url="$url"
                win_x64_sig="$sig_content"
              elif [[ -z "$win_x64_url" ]]; then
                win_x64_url="$url"
                win_x64_sig="$sig_content"
              fi
              continue
            fi

            is_android_artifact=0
            if [[ "$lower" == *android* ]] || [[ "$lower" == *.apk* ]]; then
              is_android_artifact=1
            fi

            if [[ "$is_android_artifact" -eq 1 ]]; then
              if [[ "$lower" == *aarch64* ]] || [[ "$lower" == *arm64* ]]; then
                android_aarch64_url="$url"
                android_aarch64_sig="$sig_content"
              elif [[ "$lower" == *armv7* ]] || [[ "$lower" == *armeabi-v7a* ]]; then
                android_armv7_url="$url"
                android_armv7_sig="$sig_content"
              elif [[ "$lower" == *x86_64* ]] || [[ "$lower" == *x64* ]]; then
                android_x64_url="$url"
                android_x64_sig="$sig_content"
              fi
            fi
          done

          if [[ -z "$mac_url" && -z "$win_x64_url" && -z "$win_arm64_url" && -z "$android_aarch64_url" && -z "$android_armv7_url" && -z "$android_x64_url" ]]; then
            echo "No updater signatures/artifacts found, cannot generate latest.json" >&2
            exit 1
          fi

          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\",";
            echo "  \"notes\": \"Release $TAG\",";
            echo "  \"pub_date\": \"$PUB_DATE\",";
            echo '  "platforms": {'

            first=1
            add_platform() {
              key="$1"
              signature="$2"
              url="$3"
              if [[ -z "$signature" || -z "$url" ]]; then
                return
              fi
              if [[ $first -eq 0 ]]; then
                echo ','
              fi
              echo "    \"$key\": {\"signature\": \"$signature\", \"url\": \"$url\"}"
              first=0
            }

            add_platform "darwin-aarch64" "$mac_sig" "$mac_url"
            add_platform "darwin-x86_64" "$mac_sig" "$mac_url"
            add_platform "windows-x86_64" "$win_x64_sig" "$win_x64_url"
            add_platform "windows-aarch64" "$win_arm64_sig" "$win_arm64_url"
            add_platform "android-aarch64" "$android_aarch64_sig" "$android_aarch64_url"
            add_platform "android-armv7" "$android_armv7_sig" "$android_armv7_url"
            add_platform "android-x86_64" "$android_x64_sig" "$android_x64_url"

            echo '  }'
            echo '}'
          } > "$tmp_json"

          cat "$tmp_json"
          mv "$tmp_json" latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [create-release, build-desktop, build-android, assemble-latest-json]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID, 10),
              draft: false
            });
